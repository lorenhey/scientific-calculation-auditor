[project]
name = "scientific-calculation-auditor"
version = "2.0.0"
description = "Audits scientific calculations, tracks provenance and verifies the chain of evidence with interactive web visualization and Boxmark audit reports."
authors = [{name = "Lorenzo Pérez", email = "lorenhey@example.com"}]
dependencies = [
    "pydantic",
    "typer",
    "rich",
    "pandas",
    "openpyxl",
    "nbformat",
    "nbclient",
    "ipykernel",
]

[project.scripts]
sca = "scientific_calculation_auditor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
